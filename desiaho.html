<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#0a0f1e">
<meta name="description" content="Inspección y gestión de tanques atmosféricos. Funciona con y sin conexión a internet.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SIRESP">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>SIRESP – Sistema Integrado para Evaluación de Riesgos</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{--bg:#0a0f1e;--bg2:#0f172a;--row2:#1a2740;--surf:#1e293b;--bord:#334155;--bord2:#475569;--mut:#64748b;--sub:#94a3b8;--tx2:#e2e8f0;--tx1:#f1f5f9}
body.light{--bg:#f1f5f9;--bg2:#e2e8f0;--row2:#f8fafc;--surf:#ffffff;--bord:#cbd5e1;--bord2:#94a3b8;--mut:#64748b;--sub:#475569;--tx2:#334155;--tx1:#0f172a}
body{background:var(--bg);color:var(--tx2);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;overflow-x:hidden;transition:background .25s,color .25s}
#app{min-height:100vh}
input,textarea,button{font-family:inherit}
::placeholder{color:var(--bord2)}
.c{max-width:600px;margin:0 auto;padding:16px}
.cw{max-width:1100px;margin:0 auto;padding:16px}
.bc{background:var(--surf)}.r{border-radius:14px}.p{padding:16px}.p12{padding:12px}.p14{padding:14px}
.f{display:flex}.fc{flex-direction:column}.fw{flex-wrap:wrap}.ac{align-items:center}.js{justify-content:space-between}
.f1{flex:1}.g{display:grid}.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}
.tc{text-align:center}.ts{font-size:11px;color:var(--mut)}
.f9{font-weight:900}.f8{font-weight:800}.f7{font-weight:700}.lh{line-height:1}
.mb4{margin-bottom:4px}.mb6{margin-bottom:6px}.mb8{margin-bottom:8px}.mb12{margin-bottom:12px}.mb16{margin-bottom:16px}
.mt6{margin-top:6px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}
.gap{gap:12px}.gap-sm{gap:8px}
.btn{background:var(--surf);border:2px solid var(--bord);border-radius:12px;color:var(--sub);cursor:pointer;font-size:14px;font-weight:700;padding:12px 18px;transition:all .15s}
.btn-pry{background:#f59e0b;border:none;color:#0a0f1e;font-weight:900;border-radius:14px;padding:16px;font-size:16px;cursor:pointer;width:100%}
.btn-suc{background:#22c55e;border:none;color:#0a0f1e;font-weight:900;border-radius:14px;padding:16px;font-size:16px;cursor:pointer;width:100%}
.btn-pry:disabled,.btn-suc:disabled{background:var(--bord);color:var(--mut);cursor:not-allowed}
.btn-ghost{background:transparent;border:1px solid var(--bord);border-radius:10px;color:var(--mut);cursor:pointer;padding:7px 14px;font-size:13px}
.badge{border-radius:20px;padding:2px 10px;font-size:11px;font-weight:700}
.badge-sm{border-radius:8px;padding:1px 6px;font-size:9px;font-weight:700}
input,textarea{background:var(--bg2);border:2px solid var(--bord);border-radius:10px;color:var(--tx1);font-size:14px;padding:12px;width:100%;outline:none;transition:border .2s}
input:focus,textarea:focus{border-color:#3b82f6}
textarea{resize:none}
.hero{background:#2f373e;border-bottom:1px solid var(--bord);padding:14px 14px 16px;text-align:center}body.light .hero{background:#dfe7eb}
.hero-icon{font-size:50px;margin-bottom:8px}
.hero-sub{font-size:10px;color:var(--bord2);letter-spacing:3px}
.hero-title{font-size:26px;font-weight:900;color:var(--tx1)}
.hero-desc{font-size:13px;color:var(--mut);margin-top:8px}
.brand-img{display:block;width:100%;max-width:1024px;margin:0 auto;border-radius:14px}
.only-light{display:none}body.light .only-light{display:block}body.light .only-dark{display:none}
.stb{background:var(--surf);border-radius:12px;padding:14px 10px;text-align:center;border:1px solid var(--bord)}
.stb-n{font-size:26px;font-weight:900;line-height:1}
.stb-l{font-size:10px;color:var(--mut);margin-top:3px}
.mbtn{background:var(--surf);border:2px solid var(--bord);border-radius:16px;cursor:pointer;padding:18px 14px;text-align:center;width:100%}
.mbtn-ic{font-size:30px;margin-bottom:7px}
.mbtn-t{font-size:14px;font-weight:800}
.mbtn-d{font-size:11px;color:var(--mut);margin-top:3px}
.pin-d{width:13px;height:13px;border-radius:50%;background:var(--bord);transition:background .2s}
.pin-d.f{background:#3b82f6}.pin-d.fa{background:#f59e0b}
.pin-b{background:#1e3a5f;border:none;border-radius:12px;color:#fff;cursor:pointer;font-size:17px;font-weight:700;padding:14px}
.pin-b:active{opacity:.7}.pin-b.e{background:transparent;cursor:default}
.ch{background:var(--bg2);padding:12px 16px;flex-shrink:0}
.cp-h{height:5px;background:var(--surf);border-radius:3px;overflow:hidden;flex:1}
.cp-b{height:100%;border-radius:3px;transition:width .3s}
.cc{background:var(--surf);border-radius:18px;padding:18px;border:2px solid var(--bord);display:flex;flex-direction:column;overflow:auto;transition:all .12s;flex:1}
.co{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.co button{padding:16px 8px;border-radius:12px;border:3px solid;font-size:14px;font-weight:900;cursor:pointer;transition:all .15s}
.cn{display:flex;gap:8px;margin-top:8px}
.cn button{flex:1;padding:13px;border:none;border-radius:12px;font-size:15px;font-weight:700;cursor:pointer}
.th{background:var(--bg2);border-bottom:1px solid var(--surf);padding:12px 16px;flex-wrap:wrap}
.tl{background:var(--surf);padding:9px 16px;display:flex;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--bg2)}
.sc{border-radius:14px;margin-bottom:12px;overflow:hidden}
.sh{background:var(--bg2);padding:12px 16px;cursor:pointer;display:flex;align-items:center;justify-content:space-between}
.sp{height:4px;background:var(--bord)}
.sp-b{height:100%;transition:width .4s}
.ah{background:var(--bg2);border-bottom:1px solid var(--surf);padding:12px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.at{font-size:9px;color:var(--bord2);font-weight:700;letter-spacing:1px;display:grid;gap:5px;padding:6px 16px;background:var(--bg2)}
.ar{display:grid;gap:5px;padding:11px 16px;cursor:pointer;border-bottom:1px solid var(--bg2);align-items:center}
.ar:nth-child(even){background:var(--row2)}.ar:nth-child(odd){background:var(--surf)}
.ab{background:var(--surf);border-bottom:1px solid var(--bord);padding:10px 20px}
.mc{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.mc-b{background:var(--surf);border-radius:16px;padding:24px;width:100%;max-width:440px;border:1px solid var(--bord)}
#toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);background:#22c55e;color:#0a0f1e;padding:11px 20px;border-radius:12px;font-weight:800;font-size:13px;z-index:3000;box-shadow:0 4px 24px #22c55e44;max-width:90vw;text-align:center;transition:opacity .3s;opacity:0;pointer-events:none}
#toast.show{opacity:1;pointer-events:auto}
.netpill{display:flex;align-items:center;gap:5px;padding:5px 10px;border-radius:10px;font-size:10px;font-weight:800;letter-spacing:.5px;background:#22c55e22;border:1px solid #22c55e44;color:#22c55e}
.netpill.off{background:#f59e0b22;border-color:#f59e0b44;color:#f59e0b}
.netdot{width:6px;height:6px;border-radius:50%;background:currentColor}
.installbtn{margin-top:10px}
.pg{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.pg-i{position:relative}
.pg-i img{width:60px;height:60px;object-fit:cover;border-radius:8px;border:2px solid var(--bord)}
.pg-d{position:absolute;top:-5px;right:-5px;width:18px;height:18px;border-radius:50%;background:#ef4444;border:none;color:#fff;font-size:10px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.pg-a{width:60px;height:60px;border-radius:8px;border:2px dashed var(--bord2);background:var(--bg2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;flex-shrink:0}
.tec-item{padding:12px 16px;border-bottom:1px solid var(--bg2)}
.tec-item:nth-child(even){background:var(--row2)}
.tec-item:nth-child(odd){background:var(--surf)}
canvas.chart{width:100%;height:100%;display:block}
.ct{width:100%;height:160px;position:relative}
.ld{display:flex;align-items:center;justify-content:center;min-height:100vh;flex-direction:column;gap:8px}
.ld-ic{font-size:48px}.ld-l{color:#f59e0b;font-size:14px;font-weight:700}
@media(max-width:480px){.tl{gap:6px}.g2{grid-template-columns:1fr}.g4{grid-template-columns:1fr}}
/* Lightbox de fotos */
.lb{position:fixed;inset:0;background:rgba(3,7,15,.96);z-index:4000;display:flex;flex-direction:column}
.lb-h{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid #1e293b;color:#e2e8f0;font-size:13px;font-weight:700}
.lb-x{background:transparent;border:1px solid #334155;color:#e2e8f0;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer}
.lb-b{flex:1;overflow:auto;display:flex;flex-wrap:wrap;gap:12px;padding:16px;align-content:flex-start;justify-content:center}
.lb-i{background:#0f172a;border:1px solid #334155;border-radius:12px;padding:8px;max-width:100%}
.lb-i img{display:block;max-width:min(92vw,760px);max-height:70vh;border-radius:8px;cursor:zoom-in}
.lb-i div{font-size:10px;color:#94a3b8;margin-top:6px;text-align:center}
/* Acceso Firebase (email/contraseña) */
.fba-i{width:100%;background:var(--bg2);border:2px solid var(--bord);border-radius:10px;color:var(--tx1);font-size:14px;padding:12px;margin-bottom:10px;box-sizing:border-box}
.fba-i:focus{border-color:#3b82f6}
.fba-e{font-size:12px;color:#ef4444;font-weight:700;min-height:8px;margin-bottom:6px}
/* Chips y usuarios */
.ph-chip{display:inline-block;background:var(--bg2);border:1px solid var(--bord);border-radius:12px;color:var(--sub);font-size:10px;font-weight:700;padding:3px 9px;cursor:pointer}
.ph-chip:hover{border-color:#3b82f6;color:#60a5fa}
.urole{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 10px;background:var(--bg2);border:1px solid var(--bord);border-radius:10px;margin-bottom:6px;font-size:12px}
</style>
</head>

<div id="app"></div>
<script>
// SIRESP v1.0 - Sistema Integral de Riesgos
const QD=[

["5.14","Contra Incendio",5,"🔥","¿Los hidrantes cercanos al tanque están accesibles y operativos?","Mitigación",3,"Hidrante inaccesible = tiempo crítico perdido en emergencia."],
["6.1","Sistema de Venteo",6,"↑","¿El sistema de ventilación está operativo?","Preventiva",3,"Acumulación de vapores inflamables en espacio vapor."],

["9.2","Detección F&G",9,"🚨","¿Los detectores de humo y gas están limpios y sin obstrucciones?","Preventiva",3,"Detector sucio no activa la alarma en el momento crítico."],

let _idbP=null;
function idbOpen(){
  if(_idbP)return _idbP;
  _idbP=new Promise(function(res,rej){
    if(!window.indexedDB){rej(new Error("IndexedDB no disponible"));return;}
    const rq=indexedDB.open("desiaho-db",1);
    rq.onupgradeneeded=function(e){const db=e.target.result;if(!db.objectStoreNames.contains("photos"))db.createObjectStore("photos",{keyPath:"key"});};
    rq.onsuccess=function(e){const db=e.target.result;db.onversionchange=function(){db.close();_idbP=null;};res(db);};
    rq.onerror=function(e){_idbP=null;rej(e);};
  });
  return _idbP;
}
async function idbPutMany(rows){
  const db=await idbOpen();
  return new Promise(function(res,rej){const tx=db.transaction("photos","readwrite");const st=tx.objectStore("photos");rows.forEach(function(r){st.put({key:r.key,images:r.images});});tx.oncomplete=function(){res(true);};tx.onerror=function(e){rej(e);};});
}
async function idbGet(key){
  const db=await idbOpen();
  return new Promise(function(res,rej){const rq=db.transaction("photos").objectStore("photos").get(key);rq.onsuccess=function(){res(rq.result?rq.result.images:[]);};rq.onerror=function(e){rej(e);};});
}
async function idbAll(){
  const db=await idbOpen();

}
// Redimensiona fotos antes de guardar (menos espacio, compatible l\u00edmites)
function downscaleImage(file,maxDim,quality){
  maxDim=maxDim||1280;quality=quality||0.72;
  return new Promise(function(res,rej){
    const fr=new FileReader();
    fr.onerror=function(){rej(new Error("No se pudo leer la imagen"));};
    fr.onload=function(){
      const img=new Image();
      img.onerror=function(){res(fr.result);};
      img.onload=function(){
        try{
          let w=img.width,h=img.height;
          if(Math.max(w,h)>maxDim){const k=maxDim/Math.max(w,h);w=Math.round(w*k);h=Math.round(h*k);}
          const cv=document.createElement("canvas");cv.width=w;cv.height=h;
          cv.getContext("2d").drawImage(img,0,0,w,h);
          res(cv.toDataURL("image/jpeg",quality));
        }catch(err){res(fr.result);}
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(file);
  });
}

function importBackup(inp){
  const f=inp.files&&inp.files[0];if(!f)return;
  const fr=new FileReader();
  fr.onload=function(){
    try{
      const d=JSON.parse(fr.result);
      if(!d||d.app!=="desiaho"||!Array.isArray(d.tanks)||!Array.isArray(d.inspections)){showToast("Archivo no v\u00e1lido: no es un backup SIRESP.","#ef4444");return;}
      let nt=0,ni=0,nins=0;
      d.tanks.forEach(function(t){if(t&&t.id&&!S.tanks.some(function(x){return x.id===t.id;})){S.tanks.push(t);nt++;}});
      d.inspections.forEach(function(i){if(i&&i.id&&!S.inspections.some(function(x){return x.id===i.id;})){S.inspections.push(i);ni++;}});
      if(Array.isArray(d.insts))d.insts.forEach(function(x){if(x&&x.id&&x.nombre&&!S.insts.some(function(y){return y.id===x.id||y.nombre===x.nombre;})){S.insts.push(x);nins++;}});
      saveTanksToLS();saveInspsToLS();saveInstsToLS();
      const ph=Array.isArray(d.photos)?d.photos.filter(function(r){return r&&r.key&&Array.isArray(r.images);}):[];
      const done=function(){render();showToast("\u2714 Importado: "+nt+" tanques, "+ni+" inspecciones"+(nins?", "+nins+" instalaciones":"")+", "+ph.length+" registros de fotos.","#22c55e");};
      if(ph.length){idbPutMany(ph).then(done).catch(function(){render();showToast("\u2714 Datos importados (las fotos no se pudieron guardar).","#f59e0b");});}
      else done();
    }catch(e){showToast("Error al importar: "+e.message,"#ef4444");}
  };
  fr.readAsText(f);
  inp.value="";
}

function fbErrMsg(e){

  if(c==="auth/missing-password")return "Ingresa la contrase\u00f1a.";
  if(c==="auth/user-not-found")return "No existe ese usuario. Crea la cuenta.";
  if(c==="auth/wrong-password"||c==="auth/invalid-credential")return "Contrase\u00f1a incorrecta.";
  if(c==="auth/email-already-in-use")return "Ese email ya est\u00e1 registrado. Inicia sesi\u00f3n.";
  if(c==="auth/weak-password")return "La contrase\u00f1a debe tener 6+ caracteres.";
  if(c==="auth/too-many-requests")return "Demasiados intentos. Espera un momento.";
  if(c==="auth/network-request-failed")return "Sin conexi\u00f3n con Firebase.";
  if(c.indexOf("api-key-not-valid")>=0)return "Configuraci\u00f3n de Firebase inv\u00e1lida (apiKey). Revisa el JSON en Panel Admin \u2192 \u2601 Datos.";
  return (e&&e.message)?e.message:"Error de autenticaci\u00f3n.";

async function fbLogin(){
  const a=S.fbAuth;if(a.busy)return;
  a.email=(a.email||"").trim();
  if(!a.email||!a.pass){a.err="Ingresa email y contrase\u00f1a.";render();return;}
  if(a.mode==="register"){
    if(a.pass.length<6){a.err="La contrase\u00f1a debe tener 6+ caracteres.";render();return;}
    if(a.pass!==a.pass2){a.err="Las contrase\u00f1as no coinciden. Revisa la confirmaci\u00f3n.";render();return;}
  }
  a.busy=true;a.err="";render();
  try{
    const F=await fbLoad();
    let cred;
    if(a.mode==="register"){
      try{cred=await F.au.createUserWithEmailAndPassword(F.auth,a.email,a.pass);}
      catch(e){if(e.code==="auth/email-already-in-use"){cred=await F.au.signInWithEmailAndPassword(F.auth,a.email,a.pass);}else throw e;}
    }else{
      try{cred=await F.au.signInWithEmailAndPassword(F.auth,a.email,a.pass);}
      catch(e){if(e.code==="auth/user-not-found"){a.busy=false;a.err="No existe ese email. Pulsa \u00abCrear cuenta\u00bb.";render();return;}throw e;}
    }
    await fbAfterLogin(cred.user);
  }catch(e){
    a.busy=false;a.err=fbErrMsg(e);render();
  }
}

    ]);
    let nt=0,ni=0,nins=0;
    rs[0].docs.forEach(function(d){const t=d.data();if(!t||!t.id)return;const ex=S.tanks.find(function(x){return x.id===t.id;});
      if(!ex){S.tanks.push(t);nt++;}else if((t.updatedAt||0)>(ex.updatedAt||0)){Object.assign(ex,t);nt++;}});
    rs[1].docs.forEach(function(d){const i=d.data();if(!i||!i.id)return;const idx=S.inspections.findIndex(function(x){return x.id===i.id;});
      if(idx<0){S.inspections.push(i);ni++;}else if((i.updatedAt||0)>(S.inspections[idx].updatedAt||0)){S.inspections[idx]=i;ni++;}});
    rs[2].docs.forEach(function(d){const i=d.data();if(!i||!i.id)return;const ex=S.insts.find(function(x){return x.id===i.id;});
      if(!ex){S.insts.push(i);nins++;}else if((i.updatedAt||0)>(ex.updatedAt||0)){Object.assign(ex,i);nins++;}});
    saveTanksToLS();saveInspsToLS();saveInstsToLS();
    if(!silent){showToast("\u2714 Sincronizado \u2014 "+nt+" tanques, "+ni+" inspecciones y "+nins+" instalaciones.","#22c55e");render();}
    return{nt:nt,ni:ni,nins:nins};
  })().finally(function(){FB._sync=null;});
  return FB._sync;
}

      if(user){

        const wasLogged=!!S.auth;
        F.fs.getDoc(F.fs.doc(F.db,"users/"+user.uid)).then(function(snap){

          if(!snap.exists()){F.fs.setDoc(F.fs.doc(F.db,"users/"+user.uid),{email:user.email,role:"inspector",createdAt:Date.now(),updatedAt:Date.now()}).catch(function(){});}
          S.auth=role;S.fbUser=user.uid;S.fbEmail=user.email;
          if(!wasLogged&&S.page==="login"){if(role==="admin"&&S.role==="admin")go("admin");else go("home");}

          fbSync(true).catch(function(){});
        }).catch(function(){render();});

        if(S.fbUser){S.auth=null;S.fbUser=null;S.fbEmail=null;if(S.page!=="login")go("home");}

// Charts
function drawTrendChart(canvasId,data,color){
  const c=document.getElementById(canvasId);if(!c||!data||data.length<2)return;
  const rect=c.parentElement.getBoundingClientRect();
  c.width=rect.width*2;c.height=rect.height*2;
  const ctx=c.getContext("2d");const w=c.width,h=c.height,pr=2;
  const P={t:20*pr,r:15*pr,b:35*pr,l:45*pr};
  const cw=w-P.l-P.r,ch=h-P.t-P.b;
  ctx.clearRect(0,0,w,h);
  const vals=data.map(d=>d.score||0);const mx=100,mn=0;
  ctx.strokeStyle="#1e293b";ctx.lineWidth=1;
  for(let i=0;i<=4;i++){const y=P.t+(ch-((i/4)*ch));ctx.beginPath();ctx.moveTo(P.l,y);ctx.lineTo(w-P.r,y);ctx.stroke();ctx.fillStyle="#475569";ctx.font=(10*pr)+"px sans-serif";ctx.textAlign="right";ctx.fillText(Math.round(mx-(i/4)*(mx-mn))+"%",P.l-6*pr,y+4*pr);}
  ctx.fillStyle="#475569";ctx.font=(9*pr)+"px sans-serif";ctx.textAlign="center";
  vals.forEach((_,i)=>{const x=P.l+(i/(vals.length-1))*cw;const lbl=data[i].f?data[i].f.slice(0,5):"";ctx.fillText(lbl,x,h-P.b+16*pr);});
  ctx.strokeStyle=color;ctx.lineWidth=3*pr;ctx.lineJoin="round";ctx.lineCap="round";ctx.beginPath();
  vals.forEach((v,i)=>{const x=P.l+(i/(vals.length-1))*cw;const y=P.t+ch-((v-mn)/(mx-mn))*ch;i===0?ctx.moveTo(x,y):ctx.lineTo(x,y);});ctx.stroke();
  vals.forEach((v,i)=>{const x=P.l+(i/(vals.length-1))*cw;const y=P.t+ch-((v-mn)/(mx-mn))*ch;ctx.beginPath();ctx.arc(x,y,4*pr,0,Math.PI*2);ctx.fillStyle=color;ctx.fill();ctx.strokeStyle="#0a0f1e";ctx.lineWidth=2*pr;ctx.stroke();});
}
function drawPieChart(canvasId,data){
  const c=document.getElementById(canvasId);if(!c)return;
  const rect=c.parentElement.getBoundingClientRect();c.width=rect.width*2;c.height=rect.height*2;
  const ctx=c.getContext("2d");const w=c.width,h=c.height,pr=2;
  ctx.clearRect(0,0,w,h);
  if(!data||!data.length){ctx.fillStyle="#475569";ctx.font=(11*pr)+"px sans-serif";ctx.textAlign="center";ctx.fillText("Sin datos de inspecci\u00f3n",w/2,h/2);return;}
  const cx=w/2,cy=h/2-10*pr,rad=Math.min(w/2,h/2)-20*pr;
  const total=data.reduce((a,d)=>a+d.value,0);if(!total){ctx.fillStyle="#475569";ctx.font=(11*pr)+"px sans-serif";ctx.textAlign="center";ctx.fillText("Sin datos de inspecci\u00f3n",w/2,h/2);return;}
  let ang=-Math.PI/2;
  data.forEach(d=>{const sl=(d.value/total)*Math.PI*2;ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,rad,ang,ang+sl);ctx.closePath();ctx.fillStyle=d.color;ctx.fill();const ma=ang+sl/2;ctx.fillStyle="#94a3b8";ctx.font=(11*pr)+"px sans-serif";ctx.textAlign="center";if(d.value>0)ctx.fillText(d.name.slice(0,4)+" "+d.value,cx+Math.cos(ma)*(rad+15*pr),cy+Math.sin(ma)*(rad+15*pr)+4*pr);ang+=sl;});
}
function drawBarChart(canvasId,data,color){
  const c=document.getElementById(canvasId);if(!c||!data||!data.length)return;
  const rect=c.parentElement.getBoundingClientRect();c.width=rect.width*2;c.height=rect.height*2;
  const ctx=c.getContext("2d");const w=c.width,h=c.height,pr=2;
  const P={t:10*pr,r:15*pr,b:25*pr,l:80*pr};const cw=w-P.l-P.r,ch=h-P.t-P.b;
  ctx.clearRect(0,0,w,h);const mx=Math.max(...data.map(d=>d.v),1);const bh=Math.min(26*pr,(ch-8*pr)/data.length);const gap=4*pr;
  if(!CanvasRenderingContext2D.prototype.roundRect){CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){this.moveTo(x+r,y);this.lineTo(x+w-r,y);this.quadraticCurveTo(x+w,y,x+w,y+r);this.lineTo(x+w,y+h-r);this.quadraticCurveTo(x+w,y+h,x+w-r,y+h);this.lineTo(x+r,y+h);this.quadraticCurveTo(x,y+h,x,y+h-r);this.lineTo(x,y+r);this.quadraticCurveTo(x,y,x+r,y);this.closePath();return this;};}
  data.forEach((d,i)=>{const bw=(d.v/mx)*cw;const y=P.t+i*(bh+gap);ctx.fillStyle="#334155";ctx.beginPath();ctx.roundRect(P.l,y,cw,bh,4*pr);ctx.fill();ctx.fillStyle=color||"#ef4444";ctx.beginPath();ctx.roundRect(P.l,y,bw,bh,[0,4*pr,4*pr,0]);ctx.fill();ctx.fillStyle="#94a3b8";ctx.font=(9*pr)+"px sans-serif";ctx.textAlign="right";ctx.fillText(d.name,P.l-6*pr,y+bh/2+3*pr);if(bw>40*pr){ctx.fillStyle="#fff";ctx.font=(9*pr)+"px sans-serif";ctx.textAlign="left";ctx.fillText(d.v,P.l+6*pr,y+bh/2+3*pr);}});
}

function updateTecNote(qid,v){S.tecnico.notes[qid]=v;}
function tecnicoToggle(sid){S.tecnico.open[sid]=!S.tecnico.open[sid];render();}
function tecnicoPick(qid,val){S.tecnico.answers[qid]=S.tecnico.answers[qid]===val?null:val;render();}
function tecnicoSave(){
  const t=S.tecnico;const tank=S.tanks.find(x=>x.id===t.tankId);
  if(!tank||!t.auditor.trim()){showToast("Datos incompletos.","#ef4444");return;}
  const btn=document.getElementById("tec-save-btn");if(btn){btn.disabled=true;btn.textContent="Guardando\u2026";}
  const score=calc(t.answers);const lv2=lv(score);
  const nc=Object.values(t.answers).filter(v=>v==="NC").length;
  const cp=Object.values(t.answers).filter(v=>v==="CP").length;
  const hallazgos=QUESTIONS.filter(q=>t.answers[q.id]==="NC"||t.answers[q.id]==="CP").map(q=>({sec:q.sec,id:q.id,txt:t.notes[q.id]||q.text.slice(0,50)+"\u2026",tipo:t.answers[q.id],fotos:0}));
  const insp={id:tank.id+"-"+Date.now(),tankId:tank.id,tag:tank.id,instalacion:tank.instalacion,producto:tank.producto,capacidad:tank.capacidad,auditor:t.auditor,fecha:t.fecha||new Date().toISOString().split("T")[0],score,nc,cp,nivel:lv2.l,hallazgos,answers:Object.assign({},t.answers),notes:Object.assign({},t.notes),modulo:"Panel T\u00e9cnico"};
  saveInspToLS(insp);fbPushInsp(insp);showToast("\u2714 Inspecci\u00f3n "+insp.tag+" guardada \u2014 "+insp.score+"% "+insp.nivel);
  t.tankId=null;t.auditor="";t.fecha="";t.answers={};t.notes={};t.open={1:true};go("home");
}
// Admin
function showAddTank(){S.admin.addTank=true;render();}
function showInsts(){S.admin.instsModal=true;S.admin.instEdit=null;S.admin.instForm={nombre:"",desc:"",proceso:"",ubicacion:""};render();}
function editInst(id){const it=S.insts.find(function(x){return x.id===id;});if(!it)return;S.admin.instEdit=id;S.admin.instForm={nombre:it.nombre,desc:it.desc||"",proceso:it.proceso||"",ubicacion:it.ubicacion||""};render();}
function editInstFromTable(id){showInsts();editInst(id);}
function cancelInst(){S.admin.instEdit=null;S.admin.instForm={nombre:"",desc:"",proceso:"",ubicacion:""};render();}
function delInst(id){
  const it=S.insts.find(function(x){return x.id===id;});if(!it)return;
  const nt=S.tanks.filter(function(t){return t.instalacion===it.nombre;}).length;
  if(!confirm("\u00bfQuitar la instalaci\u00f3n \u00ab"+it.nombre+"\u00bb?"+(nt?" Sus "+nt+" tanques no se borran, solo cambian de agrupaci\u00f3n vac\u00eda.":"")))return;
  S.insts=S.insts.filter(function(x){return x.id!==id;});
  saveInstsToLS();
  try{if(fbEnabled()&&FB.ready&&FB.user&&navigator.onLine)FB.fs.deleteDoc(FB.fs.doc(FB.db,"instalaciones/"+id));}catch(e){}
  if(S.admin.instEdit===id)cancelInst();else render();
  showToast("\u2714 Instalaci\u00f3n quitada.","#22c55e");
}
function saveInst(){
  const f=S.admin.instForm;const nombre=String(f.nombre||"").trim();
  if(!nombre){showToast("Escribe el nombre de la instalaci\u00f3n.","#f59e0b");return;}
  const dup=S.insts.some(function(x){return x.nombre.toLowerCase()===nombre.toLowerCase()&&x.id!==S.admin.instEdit;});
  if(dup){showToast("Ya existe una instalaci\u00f3n con ese nombre.","#ef4444");return;}
  const data={nombre:nombre,desc:String(f.desc||"").trim(),proceso:String(f.proceso||"").trim(),ubicacion:String(f.ubicacion||"").trim(),updatedAt:Date.now()};
  if(S.admin.instEdit){
    const it=S.insts.find(function(x){return x.id===S.admin.instEdit;});
    if(it){
      const oldName=it.nombre;
      Object.assign(it,data);
      if(oldName!==nombre)S.tanks.forEach(function(t){if(t.instalacion===oldName){t.instalacion=nombre;t.updatedAt=Date.now();fbPushTank(t);}});
      saveTanksToLS();fbPushInst(it);
      showToast("\u2714 Instalaci\u00f3n actualizada.","#22c55e");
    }
  }else{
    const it=Object.assign({id:"INS-"+Date.now().toString(36).toUpperCase()},data);
    S.insts.push(it);fbPushInst(it);
    showToast("\u2714 Instalaci\u00f3n agregada.","#22c55e");
  }
  saveInstsToLS();cancelInst();
}

function renderAdminCharts(){
  const insp=S.inspections;const tanks=S.tanks;
  const tIns=tid=>insp.filter(i=>i.tankId===tid).sort((x,y)=>new Date(x.fecha)-new Date(y.fecha));
  const lastI=t=>{const ins=tIns(t.id);return ins.length?ins[ins.length-1]:null;};
  const fleet=tanks.map(t=>{const li=lastI(t);return{...t,last:li,score:li?.score??null,nivel:li?.nivel??"Sin inspeccion"};});
  const insp2=fleet.filter(t=>t.score!==null);
  const distrib=Object.entries(fleet.reduce((a,t)=>{const k=t.nivel||"Sin inspeccion";a[k]=(a[k]||0)+1;return a;},{})).map(([name,value])=>({name,value,color:name==="Sin inspeccion"?"var(--bord2)":lv(insp2.find(t=>t.nivel===name)?.score??0).c}));
  const allNC=insp.flatMap(i=>(i.hallazgos||[]).filter(h=>h.tipo==="NC").map(h=>({...h,tank:i.tag,fecha:i.fecha,inspector:i.auditor,score:i.score})));
  const ncBySec={};allNC.forEach(h=>{ncBySec[h.sec]=(ncBySec[h.sec]||0)+1;});
  const ncSecD=Object.entries(ncBySec).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([name,v])=>({name:name.replace("Contra Incendio","SCI").replace("Sistema de ","").replace("Proteccion ","Prot. ").replace("Deteccion F&G","F&G"),v}));
  if(distrib.length)drawPieChart("pie-chart",distrib);
  if(ncSecD.length)drawBarChart("nc-bar-chart",ncSecD,"#ef4444");
}

function printCampoReport(){
  const c=S.campo;const tank=S.tanks.find(t=>t.id===c.tankId);
  if(!tank){showToast("Datos de tanque no disponibles.","#ef4444");return;}
  const score=calc(c.answers);const nc=Object.values(c.answers).filter(v=>v==="NC").length;
  const cp=Object.values(c.answers).filter(v=>v==="CP").length;
  const insp={auditor:c.auditor,fecha:new Date().toISOString().split("T")[0],score,nc,cp,nivel:lv(score).l,answers:Object.assign({},c.answers),notes:Object.assign({},c.notes),modulo:"Inspecci\u00f3n de Campo"};

}

function trendSvg(data){
  if(!data||data.length<2)return'<div class="nohist">Histórico insuficiente (se requiere al menos 2 inspecciones)</div>';
  var w=540,h=104,pad=12,pts=[],i,j,k,m,g,gy,step;
  for(i=0;i<data.length;i++)pts.push({x:pad+i*((w-pad*2)/(data.length-1)),y:h-pad-((data[i].score||0)/100)*(h-pad*2),f:data[i].f});
  var line="";
  for(j=0;j<pts.length;j++)line+=(j?" ":"")+pts[j].x.toFixed(1)+","+pts[j].y.toFixed(1);
  var area=pad+","+(h-pad)+" "+line+" "+pts[pts.length-1].x.toFixed(1)+","+(h-pad);
  var ink=lv(data[data.length-1].score).c;
  var s='<svg viewBox="0 0 '+w+' '+h+'" width="100%" style="display:block;border:1px solid #cbd5e1;border-radius:6px;background:#fff">';
  for(g=0;g<=100;g+=25){gy=h-pad-(g/100)*(h-pad*2);s+='<line x1="'+pad+'" y1="'+gy.toFixed(1)+'" x2="'+(w-pad)+'" y2="'+gy.toFixed(1)+'" stroke="#e2e8f0" stroke-width="1"/><text x="1" y="'+(gy+3).toFixed(1)+'" font-size="7" fill="#94a3b8">'+g+'</text>';}
  s+='<polygon points="'+area+'" fill="'+ink+'" opacity="0.09"/>';
  s+='<polyline points="'+line+'" fill="none" stroke="'+ink+'" stroke-width="2" stroke-linejoin="round"/>';
  for(k=0;k<pts.length;k++)s+='<circle cx="'+pts[k].x.toFixed(1)+'" cy="'+pts[k].y.toFixed(1)+'" r="2.4" fill="'+ink+'"/>';
  step=Math.ceil(data.length/8);
  for(m=0;m<pts.length;m++){if(m%step===0||m===pts.length-1)s+='<text x="'+pts[m].x.toFixed(1)+'" y="'+(h-2)+'" font-size="7" fill="#64748b" text-anchor="middle">'+esc(pts[m].f)+'</text>';}
  return s+'</svg>';
}
function printFleetReport(){
  var tanks=S.tanks,inspections=S.inspections;

    var ts=tanks.filter(function(t){return t.instalacion===name;});
    var ids=new Set(ts.map(function(t){return t.id;}));

    var scored=ts.map(function(t){var l=inspsOf(ins,t.id);return l.length?l[l.length-1].score:null;}).filter(function(v){return v!==null&&v!==undefined;});
    var dias=ts.map(function(t){var l=inspsOf(ins,t.id);return l.length?dsSafe(l[l.length-1].fecha):null;}).filter(function(v){return v!==null;});
    return{name:name,ts:ts,ins:ins,scored:scored,
      avg:scored.length?Math.round(scored.reduce(function(a,v){return a+v;},0)/scored.length):null,
      crit:scored.filter(function(v){return v<60;}).length,
      sin:ts.length-scored.length,
      nc:ins.reduce(function(a,i){return a+(i.nc||0);},0),
      maxDias:dias.length?Math.max.apply(null,dias):null};
  });
  var allSc=tanks.map(function(t){var l=inspsOf(inspections,t.id);return l.length?l[l.length-1].score:null;}).filter(function(v){return v!==null;});

  html+='<div class="hd"><div style="font-size:22px">⬡</div><div><div class="e">SIRESP</div><div class="s">SISTEMA INTEGRAL DE RIESGOS — INFORME DE FLOTA DE TANQUES ATMOSFÉRICOS (TECHO CÓNICO)</div></div>'+

    '<div style="border-top-color:'+(totNC>10?"#ef4444":"#f59e0b")+'"><div class="v" style="color:'+(totNC>10?"#ef4444":"#f59e0b")+'">'+totNC+'</div><div class="l">NC TOTALES</div></div>'+

    r.ts.forEach(function(t){
      var l=inspsOf(r.ins,t.id),last=l.length?l[l.length-1]:null;
      var slv=last?lv(last.score):{l:"Sin inspección",c:"#64748b"};

      '<div><div class="v" style="color:'+(last&&last.cp>0?"#f59e0b":"#16a34a")+'">'+(last?last.cp:"—")+'</div><div class="l">CP ÚLTIMA</div></div>'+
      '<div><div class="v" style="color:'+((dd||0)>180?"#ef4444":"#64748b")+'">'+(dd!==null?dd+"d":"—")+'</div><div class="l">DÍAS</div></div></div>';
